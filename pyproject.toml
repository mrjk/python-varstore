[project]
name = "varstore"
version = "0.1.0"
description = "Hierarchical variable store with shell-style template expansion"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
  {name = "mrjk", email = "mrjk.78@gmail.com"},
]
keywords = [
    "variables",
    "config",
    "store",
    "expand",
    "template",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
tests = ["pytest"]

[project.urls]
Homepage = "https://github.com/mrjk/python-varstore"
Repository = "https://github.com/mrjk/python-varstore"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/varstore discovered automatically by hatchling

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/LICENSE",
    "/LICENSE.expandvars",
    "/NOTICE",
    "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
