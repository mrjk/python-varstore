---
name: test-project

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch or tag). Empty = branch selected in the UI."
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with:
          python_version: ${{ matrix.python-version }}
          uv_args: "--all-groups"

      - name: Run full test gate
        run: task test
