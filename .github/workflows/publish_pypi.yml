---
name: publish-pypi

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish (branch or tag, e.g. v0.1.1). Empty = branch selected in the UI."
        required: false
        type: string
      skip_publish:
        description: "Run tests only (do not upload to PyPI)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with:
          python_version: ${{ matrix.python-version }}
          uv_args: "--all-groups"
      - name: Run full test gate
        run: task test

  publish:
    needs: test
    if: ${{ !inputs.skip_publish }}
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with:
          python_version: "3.12"
          uv_args: "--group dev"
      - name: Publish to PyPI
        run: task publish_pypi
